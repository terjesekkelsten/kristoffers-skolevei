name: Tester
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Oppgavegeneratorer
        run: node tests/run.mjs
      - name: Installer Playwright
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Røyktest i nettleser
        run: node tests/smoke.mjs
