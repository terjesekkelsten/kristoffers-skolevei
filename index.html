<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kristoffers Skolevei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#23493a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Skolevei">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">

<div id="wrap">
  <div id="box">
    <div id="screen">
      <canvas id="cv" width="640" height="400" aria-label="Spillskjerm"></canvas>
      <canvas id="hc" hidden></canvas>
      <button id="bCheat" aria-label="Juks er på" hidden>JUKS PÅ</button>
      <div id="status"><span id="sPts">Poeng: 0 av 100</span><span id="sTitle">Kristoffers skolevei</span><span id="sClock">07:25</span></div>
      <div id="mapLbl" hidden></div>
      <div id="sub" hidden></div>
      <div id="toast" hidden></div>
      <div id="dlg" hidden>
        <canvas id="por" width="24" height="24"></canvas>
        <div id="dBody"><div id="dName"></div><div id="dText"></div><div id="dChoice" hidden></div><div id="dMore">Trykk for å fortsette ▸</div></div>
      </div>
    </div>
    <div id="bar">
      <button class="slot off" id="slot-mat" aria-label="Matpakke"><canvas width="16" height="12"></canvas></button>
      <button class="slot off" id="slot-flaske" aria-label="Vannflaske"><canvas width="16" height="12"></canvas></button>
      <button class="slot off" id="slot-jakke" aria-label="Jakke"><canvas width="16" height="12"></canvas></button>
      <button class="slot off" id="slot-vest" aria-label="Refleksvest"><canvas width="16" height="12"></canvas></button>
      <button class="slot off" id="slot-sekk" aria-label="Sekk"><canvas width="16" height="12"></canvas></button>
      <button class="slot off" id="slot-lue" aria-label="Lue"><canvas width="16" height="12"></canvas></button>
      <div id="where"></div>
      <button class="btn" id="bHint" aria-label="Hint">?</button>
      <button class="btn" id="bSay" aria-label="Si det igjen"><svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path fill="#fff" d="M1 4h2l3-3h1v10H6L3 8H1z"/><path fill="#FFFF55" d="M8 4h1v4H8zM10 2h1v8h-1z"/></svg></button>
    </div>

    <div class="ov" id="start">
      <h1 id="startTitle">Kristoffers Skolevei</h1>
      <div class="setup">
        <div class="pv"><canvas id="pv" width="40" height="60"></canvas>
          <div id="profs"></div></div>
        <div class="cfg">
          <label for="nmIn">Navn</label><input id="nmIn" maxlength="14" autocomplete="off" value="Kristoffer">
          <span>Hår</span><div class="sw" data-k="hair"></div>
          <span>Frisyre</span><div class="sw" data-k="long"></div>
          <span>Hud</span><div class="sw" data-k="skin"></div>
          <span>Lue</span><div class="sw" data-k="hat"></div>
          <span>Jakke</span><div class="sw" data-k="jacket"></div>
          <span>Bukse</span><div class="sw" data-k="pants"></div>
        </div>
      </div>
      <div class="gobar"><button class="big" id="bStart">START SKOLEVEIEN</button><button class="big alt" id="bClass">KLASSEROMMET</button><button class="big hub" id="bHub">SKOLEKARTET</button></div>
      <button id="bPar" aria-label="For voksne">🔒 For voksne</button>
    </div>

    <div id="par" hidden></div>
    <div class="ov" id="dip" hidden>
      <div class="cert">
        <div class="eyebrow" id="dEyebrow">DIPLOM</div>
        <h2 id="dTitle">TRAFIKKHELT</h2>
        <div class="name" id="dipName">Kristoffer</div>
        <div class="stars" id="stars"></div>
        <div class="score" id="dScore"></div>
        <div class="list" id="dList"></div>
        <button class="big" id="bAgain">SPILL IGJEN</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/game.js"></script>

</body></html>
